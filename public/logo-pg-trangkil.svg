<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 90" fill="none">
  <!-- Monogram KA Icon -->
  <g fill="#0284C7">
    <!-- K Left Stem -->
    <rect x="10" y="10" width="32" height="70" rx="2" />
    <rect x="4" y="10" width="44" height="10" rx="1" />
    <rect x="4" y="70" width="44" height="10" rx="1" />
    
    <!-- K Upper Diagonal Arm -->
    <polygon points="38,45 80,10 118,10 65,52" />
    <rect x="74" y="10" width="48" height="9" rx="1" />

    <!-- K Lower Diagonal Arm -->
    <polygon points="58,46 118,70 82,70 42,56" />
    <rect x="76" y="71" width="46" height="9" rx="1" />

    <!-- A Triangle Interlock -->
    <polygon points="122,10 162,70 142,70 134,56 106,56 100,70 82,70 122,10" />
    <polygon points="122,26 112,46 130,46" fill="#ffffff" />
    <rect x="78" y="71" width="28" height="9" rx="1" />
    <rect x="138" y="71" width="28" height="9" rx="1" />
    <rect x="116" y="10" width="16" height="7" rx="1" />
  </g>

  <!-- Text: PT KEBON AGUNG -->
  <text x="250" y="32" font-family="'Arial Black', 'Impact', 'Segoe UI', sans-serif" font-weight="900" font-size="22" fill="#0284C7" letter-spacing="1.5">PT KEBON AGUNG</text>

  <!-- Text: PABRIK GULA TRANGKIL -->
  <text x="165" y="70" font-family="'Arial Black', 'Impact', 'Segoe UI', sans-serif" font-weight="900" font-size="30" fill="#0284C7" letter-spacing="0.5">PABRIK GULA TRANGKIL</text>
</svg>
